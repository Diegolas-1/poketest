[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin, *.json, *.rgba, patch_base.json"
exclude_filter="dev/*, debug/*"
export_path="build/ios/PalletTown.ipa"

[preset.0.options]

application/app_store_team_id="ABCDE12345"
application/bundle_identifier="com.diegolas.pallettown"
application/export_project_only=true
application/short_version="0.2"
application/version="2"
application/min_ios_version="16.0"
application/targeted_device_family=0
application/launch_screen_storyboard=false
user_data/accessible_from_files_app=false
; a game: the App Store category, iOS Game Mode (CPU / GPU priority, lower
; Bluetooth controller latency), controller-first (an extended gamepad)
application/additional_plist_content="<key>LSApplicationCategoryType</key><string>public.app-category.games</string><key>GCSupportsGameMode</key><true/><key>GCSupportsControllerUserInteraction</key><true/><key>GCSupportedGameControllers</key><array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>"
; more memory for the world (SideStore re-signs with the entitlements it finds in
; the app: ios.yml signs the build ad hoc with the export's entitlements file)
entitlements/increased_memory_limit=true

[preset.1]

name="pack-code"
platform="iOS"
runnable=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.bin, *.json, *.rgba"
exclude_filter="dev/*, debug/*, world/*, cast/*, interiors/*, audio/*, patch_base.json"
export_path=""

[preset.1.options]

application/app_store_team_id="ABCDE12345"
application/bundle_identifier="com.diegolas.pallettown"
application/short_version="0.1"
application/version="1"
application/min_ios_version="16.0"
application/targeted_device_family=0
application/launch_screen_storyboard=false
user_data/accessible_from_files_app=false

; pack-dir: the template of every asset pack (one folder of native/ each:
; world/base, world/plants, world/r/<region>, cast, interiors, audio).
; tools/native/publish_patch.mjs exports with a copy of this file in which
; this preset is replaced by one "pack-<name>" preset per pack, DIR = its folder.
[preset.2]

name="pack-dir"
platform="iOS"
runnable=false
dedicated_server=false
custom_features=""
export_filter="customized"
customized_files={
"res://": "remove",
"res://DIR/": "keep"
}
include_filter="DIR/*.bin, DIR/*.json, DIR/*.rgba"
exclude_filter=""
export_path=""

[preset.2.options]

application/app_store_team_id="ABCDE12345"
application/bundle_identifier="com.diegolas.pallettown"
application/short_version="0.1"
application/version="1"
application/min_ios_version="16.0"
application/targeted_device_family=0
application/launch_screen_storyboard=false
user_data/accessible_from_files_app=false
