<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pallet Town · building preview</title>
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }</script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f2}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { buildTerrain } from './terrain.js';
import { buildSky } from './nature.js';
import { buildTown } from './town.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog('#cfe6f2', 80, 300);
const sunDir = new THREE.Vector3(-0.5, 0.8, 0.45).normalize();
scene.add(buildSky(sunDir), buildTerrain());
scene.add(new THREE.HemisphereLight('#dff0ff', '#7a9a5a', 1.3));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6); sun.position.copy(sunDir).multiplyScalar(60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); const sc = sun.shadow.camera; sc.left = sc.bottom = -40; sc.right = sc.top = 40; sc.far = 200; sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const town = buildTown(); scene.add(town.group);
const c = (q.get('cam') || '-8,6,-1,-19,3,-16').split(',').map(Number);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 2000);
cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]);
sun.target.position.set(c[3], 0, c[5]); sun.position.copy(sun.target.position).addScaledVector(sunDir, 60);
let t = 0; for (const f of town.anim) f(0, t);
r.render(scene, cam); window.ready = true;
</script></body></html>
