<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ash base model</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#6a6665;font:13px system-ui,sans-serif;color:#eee}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px)}
#ui button{background:#2b2a2c;color:#eee;border:1px solid #555;border-radius:4px;padding:5px 9px;cursor:pointer}
#ui button.on{background:#c0603a;border-color:#c0603a}
#msg{position:fixed;left:8px;bottom:8px;opacity:.8;white-space:pre}
</style></head>
<body><div id="ui"></div><div id="msg">building…</div>
<script type="module">
// The base body made from the turnaround sheets (basemodel/body.js).
//   (default)        orbit it: drag to turn, wheel to zoom; buttons for the views,
//                    a walk to check the rig, and the GLB download
//   ?view=sheet      the four views of TURNAROUND_G laid out as on the sheet, in
//                    its pixel space (2000 x 1116, orthographic), so a render lines
//                    up with the drawing; &bg=0 leaves the background transparent
//   ?view=angles     the four views of VERT_ANGLES; ?view=topbottom VERT_TOP_BOTTOM
//   ?glb             load basemodel/ash_base.glb instead of building it
//   ?cell=0.0025&tris=50000  the meshing grid (metres) and triangle budget
//   ?walk[=t]        walk (held at time t)
//   ?ink=0           no outlines; &yaw= &pitch= &dist= &tx= &ty= place the orbit camera
// window.basemodel: { ready, exportGLB() -> ArrayBuffer, stats }
import * as THREE from 'three';
import { celify } from './toon.js';
import { createOutline } from './outline.js';
import { buildBody, PX, CX, GROUND, CZ } from './basemodel/body.js';
import { SKIN_SHADE, SKIN, BRIEFS, INK } from './basemodel/paint.js';

const q = new URLSearchParams(location.search);
const view = q.get('view') || 'orbit';
const SHEET = view === 'sheet';
const W = SHEET ? 2000 : innerWidth, H = SHEET ? 1116 : innerHeight;
const msg = document.getElementById('msg');
const log = (s) => { msg.textContent += '\n' + s; console.log(s); };

const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setPixelRatio(SHEET ? 1 : Math.min(devicePixelRatio, 2)); r.setSize(W, H);
r.toneMapping = THREE.NoToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
if (q.get('bg') !== '0') scene.background = new THREE.Color('#6a6665');
const SUN_I = 2.9;
const sunDir = new THREE.Vector3(-0.42, 0.42, 0.8).normalize();
const sun = new THREE.DirectionalLight('#ffffff', SUN_I); sun.position.copy(sunDir).multiplyScalar(10); scene.add(sun);
scene.add(new THREE.AmbientLight('#ffffff', 0.6));
const ink = createOutline(r, { color: INK, width: SHEET ? 1.6 : 1.3, scale: SHEET ? 1 : 1.5, fadeNear: 60, fadeFar: 120 });
ink.setSize(r.domElement.width, r.domElement.height);
if (q.get('ink') === '0') ink.enabled = false;

// two flat tones, like the sheets: lit, and a cool shade turned away from the light
const sk = new THREE.Color(SKIN), sh = new THREE.Color(SKIN_SHADE);
const shadeK = [sh.r / sk.r, sh.g / sk.g, sh.b / sk.b];
const cel = (name, map, color) => {
  const m = new THREE.MeshLambertMaterial({ name, map, color });
  return celify(m, { bands: [-1, 0.2, 9], deep: shadeK, shade: shadeK, lit: [1, 1, 1], litAdd: [0, 0, 0], soft: 0.015 });
};

// floor: a grid on the grey, as on the sheets
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: '#8a8685' }));
floor.position.y = -0.001; floor.userData.outline = 'ground';
const grid = new THREE.GridHelper(60, 240, '#5c5958', '#6f6b6a'); grid.position.y = 0.0005;
if (q.get('bg') !== '0') scene.add(floor, grid);

let model;
const stats = {};
async function getModel() {
  if (q.has('glb')) {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const g = await new GLTFLoader().loadAsync('./basemodel/ash_base.glb');
    const root = g.scene;
    root.traverse((o) => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; const out = ms.map((m) => cel(m.name, m.map, m.color)); o.material = Array.isArray(o.material) ? out : out[0]; o.frustumCulled = false; } });
    const bones = {}; root.traverse((o) => { if (o.isBone) bones[o.name] = o; });
    return { group: root, bones, src: null };
  }
  await new Promise((res) => setTimeout(res, 30));
  const opts = { log };
  if (q.has('cell')) opts.cell = +q.get('cell');
  if (q.has('tris')) opts.tris = +q.get('tris');
  const m = buildBody({ ...opts, material: cel });
  const src = () => buildBody({ ...opts, log: () => {} });   // plain materials, for the export
  return { ...m, src };
}

const t0 = performance.now();
const ready = (async () => {
  model = await getModel();
  model.group.traverse((o) => { if (o.isMesh) { stats.tris = (stats.tris || 0) + (o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3); } });
  stats.ms = performance.now() - t0;
  log(`ready: ${stats.tris} triangles, ${Math.round(stats.ms)} ms`);
  setup();
  return true;
})();

// ---------- views ----------
let camera, figures = [];
const place = (yaw, x, y = 0, z = 0) => {
  const g = figures.length ? cloneModel() : model.group;
  g.rotation.y = yaw; g.position.set(x, y, z); scene.add(g); figures.push(g); return g;
};
function cloneModel() {
  // a copy with its own skeleton
  const src = model.group, copy = src.clone(true), bones = {};
  copy.traverse((o) => { if (o.isBone) bones[o.name] = o; });
  copy.traverse((o) => { if (o.isSkinnedMesh) { const sk = new THREE.Skeleton(o.skeleton.bones.map((b) => bones[b.name]), o.skeleton.boneInverses); o.bind(sk, o.bindMatrix); } });
  return copy;
}
function setup() {
  if (SHEET) {
    // TURNAROUND_G: front, back, side facing right, side facing left
    camera = new THREE.OrthographicCamera((0 - CX) * PX, (2000 - CX) * PX, GROUND * PX, (GROUND - 1116) * PX, 0.1, 50);
    camera.position.set(0, 0, 10);
    place(0, 0);
    place(Math.PI, (979 - CX) * PX);
    place(Math.PI / 2, (CZ - CX) * PX);
    place(-Math.PI / 2, (1753 - CX) * PX);
    floor.visible = grid.visible = false;
  } else if (view === 'angles') {
    camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
    camera.position.set(0, 1.9, 6.4); camera.lookAt(0, 0.68, 0);
    place(0.5, -2.1, 0, 0); place(Math.PI + 0.65, -0.75, 0, 0); place(-0.6, 0.6, 0, 0.3); place(Math.PI - 0.7, 1.75, 0, 0.3);
  } else if (view === 'topbottom') {
    camera = new THREE.OrthographicCamera(-1.6 * W / H, 1.6 * W / H, 1.6, -1.6, 0.1, 50);
    camera.position.set(0, 10, 0); camera.up.set(0, 0, -1); camera.lookAt(0, 0, 0);
    const a = place(0, -0.8, 0.8, 0); a.rotation.set(Math.PI / 2, 0, Math.PI); // seen from below
    place(0, 0.8);
    floor.visible = grid.visible = false;
  } else {
    camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 100);
    place(0, 0);
    orbit();
  }
  if (!SHEET) addUI();
  frame();
}

// ---------- orbit ----------
const orb = { yaw: 0, pitch: 0.08, dist: 3.6, tx: 0, ty: 0.72 };
for (const k of Object.keys(orb)) if (q.has(k)) orb[k] = +q.get(k);
function orbit() {
  const upd = () => {
    camera.position.set(orb.tx + Math.sin(orb.yaw) * Math.cos(orb.pitch) * orb.dist, orb.ty + Math.sin(orb.pitch) * orb.dist, Math.cos(orb.yaw) * Math.cos(orb.pitch) * orb.dist);
    camera.lookAt(orb.tx, orb.ty, 0);
    // the light keeps to the camera's upper left, as on the sheets
    sun.position.copy(sunDir).applyQuaternion(camera.quaternion).multiplyScalar(10);
  };
  orb.upd = upd; upd();
  let drag = null;
  r.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; r.domElement.setPointerCapture(e.pointerId); });
  r.domElement.addEventListener('pointermove', (e) => {
    if (!drag) return;
    orb.yaw -= (e.clientX - drag[0]) * 0.008; orb.pitch = Math.max(-1.5, Math.min(1.5, orb.pitch + (e.clientY - drag[1]) * 0.006));
    drag = [e.clientX, e.clientY]; upd();
  });
  r.domElement.addEventListener('pointerup', () => { drag = null; });
  r.domElement.addEventListener('wheel', (e) => { orb.dist = Math.max(0.4, Math.min(12, orb.dist * Math.exp(e.deltaY * 0.001))); upd(); e.preventDefault(); }, { passive: false });
}

// ---------- a walk, to check the rig ----------
let walking = q.has('walk'), wt = +(q.get('walk') || 0);
const still = q.has('walk') && q.get('walk') !== '';   // ?walk=<t> holds that moment of the walk
function pose(g, t) {
  const B = {}; g.traverse((o) => { if (o.isBone) B[o.name] = o; });
  for (const b of Object.values(B)) b.quaternion.identity();
  if (!walking) return;
  const s = Math.sin(t * 6), c = Math.cos(t * 6);
  const rot = (n, x, y, z) => B[n] && B[n].rotation.set(x, y, z);
  rot('LeftUpLeg', -s * 0.45, 0, 0); rot('RightUpLeg', s * 0.45, 0, 0);
  rot('LeftLeg', Math.max(0, c) * 0.7, 0, 0); rot('RightLeg', Math.max(0, -c) * 0.7, 0, 0);
  rot('LeftArm', s * 0.4, 0, -0.45); rot('RightArm', -s * 0.4, 0, 0.45);
  rot('LeftForeArm', -0.3, 0, 0); rot('RightForeArm', -0.3, 0, 0);
  rot('Spine1', 0, s * 0.08, 0); rot('Head', 0.05, -s * 0.05, 0);
  for (const f of ['Index', 'Middle', 'Ring', 'Pinky']) for (let i = 1; i <= 3; i++) for (const L of ['Left', 'Right']) B[`${L}Hand${f}${i}`]?.rotation.set(0, 0, 0);
  g.position.y = Math.abs(c) * 0.02;
}

// ---------- ui ----------
function addUI() {
  const ui = document.getElementById('ui');
  const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => fn(b); ui.appendChild(b); return b; };
  if (view === 'orbit') {
    for (const [l, y, p] of [['front', 0, 0.08], ['back', Math.PI, 0.08], ['left', Math.PI / 2, 0.08], ['right', -Math.PI / 2, 0.08], ['¾', 0.7, 0.35], ['top', 0, 1.5], ['below', 0, -1.5]])
      btn(l, () => { orb.yaw = y; orb.pitch = p; orb.upd(); });
    btn('face', () => { orb.yaw = 0; orb.pitch = 0.05; orb.dist = 0.9; orb.tx = 0; orb.ty = 1.18; orb.upd(); });
    btn('body', () => { orb.dist = 3.6; orb.tx = 0; orb.ty = 0.72; orb.upd(); });
    btn('walk', (b) => { walking = !walking; b.classList.toggle('on', walking); });
  }
  btn('outline', (b) => { ink.enabled = !ink.enabled; b.classList.toggle('on', ink.enabled); }).classList.add('on');
  btn('download GLB', async () => {
    const buf = await exportGLB();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'ash_base.glb'; a.click();
  });
}

async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const m = model.src ? model.src() : model;
  return new GLTFExporter().parseAsync(m.group, { binary: true });
}

let last = performance.now();
function frame() {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (walking && !still) wt += dt;
  for (const g of figures) pose(g, wt);
  r.render(scene, camera);
  ink.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  if (SHEET) return;
  r.setSize(innerWidth, innerHeight); ink.setSize(r.domElement.width, r.domElement.height);
  if (camera.isPerspectiveCamera) { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
});
window.basemodel = { ready, exportGLB, stats };
</script></body></html>
