<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Pallet Town</title>
  <script type="importmap">
    { "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }
  </script>
  <style>
    @font-face { font-family: 'Pixelify Sans'; src: url(../hd/fonts/PixelifySans.woff2) format('woff2'); font-weight: 400 700; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe2e8; touch-action: none; user-select: none; -webkit-user-select: none; }
    #view, #ui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { pointer-events: none; }
    /* loading */
    #loading { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #f6fbf2 0%, #d7ecd9 55%, #b9d8c6 100%); color: #23284f;
      font-family: 'Pixelify Sans', system-ui, sans-serif; transition: opacity .9s ease; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { margin: 0; font-size: 46px; letter-spacing: .04em; }
    #loading p { margin: 0; font-size: 18px; opacity: .8; }
    .leaf { width: 54px; height: 54px; border-radius: 0 60% 0 60%; background: linear-gradient(135deg, #8fd48a, #3f8a45);
      animation: spin 2.4s ease-in-out infinite; box-shadow: 0 6px 18px rgba(30, 80, 40, .25); }
    @keyframes spin { 50% { transform: rotate(180deg) scale(.85); } }
    /* area banner, brush-stroke style */
    #banner { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); z-index: 6; pointer-events: none; text-align: center;
      opacity: 0; transition: opacity 1s ease; font-family: 'Pixelify Sans', system-ui, sans-serif; color: #fffdf6;
      text-shadow: 0 2px 10px rgba(20, 30, 40, .55); }
    #banner.show { opacity: 1; }
    #bannerTitle { font-size: 52px; letter-spacing: .06em; }
    #banner .stroke { height: 6px; width: 340px; margin: 4px auto 6px; border-radius: 6px;
      background: linear-gradient(90deg, transparent, rgba(255, 253, 246, .9) 15%, rgba(255, 253, 246, .9) 85%, transparent); }
    #bannerSub { font-size: 20px; opacity: .95; }
    /* hints */
    #hint { position: fixed; left: 14px; bottom: 14px; z-index: 5; font: 13px/1.5 system-ui, sans-serif; color: #fff;
      background: rgba(20, 30, 40, .45); padding: 8px 12px; border-radius: 10px; transition: opacity 1.5s ease; }
    #hint.fade { opacity: 0; }
    #inkBtn { position: fixed; top: 10px; left: 150px; z-index: 6; color: #fff; font: 13px system-ui, sans-serif; border: 0; cursor: pointer;
      background: rgba(20, 30, 40, .4); padding: 6px 10px; border-radius: 8px; }
    #back { position: fixed; top: 10px; left: 10px; z-index: 6; color: #fff; font: 13px system-ui, sans-serif;
      background: rgba(20, 30, 40, .4); padding: 6px 10px; border-radius: 8px; text-decoration: none; }
    /* touch */
    #stick { display: none; position: fixed; z-index: 7; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: rgba(255, 255, 255, .18); border: 2px solid rgba(255, 255, 255, .5); pointer-events: none; }
    #knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, .7); }
    .tbtn { display: none; position: fixed; z-index: 7; width: 64px; height: 64px; border-radius: 50%; font: 700 22px 'Pixelify Sans', sans-serif;
      color: #fff; border: 2px solid rgba(255, 255, 255, .7); align-items: center; justify-content: center; }
    #btnA { right: 22px; bottom: 96px; background: rgba(232, 70, 60, .8); }
    #btnJump { right: 96px; bottom: 40px; background: rgba(35, 40, 79, .6); font-size: 13px; }
    @media (pointer: coarse) { .tbtn { display: flex; } #hint { display: none; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="ui"></canvas>
  <div id="loading"><div class="leaf"></div><h1>Pallet Town</h1><p id="loadText">Starting</p></div>
  <div id="banner"><div id="bannerTitle"></div><div class="stroke"></div><div id="bannerSub"></div></div>
  <div id="hint">WASD move · arrow keys or drag: camera · C camera behind · Shift run · Space jump · E talk or read · wheel zoom · O outlines on/off</div>
  <a id="back" href="../">Game Boy version</a>
  <button id="inkBtn">Outlines: on</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="btnA" class="tbtn">A</div>
  <div id="btnJump" class="tbtn">Jump</div>
  <script type="module" src="main.js"></script>
</body>
</html>
