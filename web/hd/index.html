<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokémon Red · HD-2D</title>
  <link rel="stylesheet" href="../simple.css">
  <script type="importmap">
    { "imports": { "three": "./lib/three/three.module.min.js", "three/addons/": "./lib/three/addons/" } }
  </script>
  <style>
    @font-face { font-family: 'Pixelify Sans'; src: url(fonts/PixelifySans.woff2) format('woff2'); font-weight: 400 700; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    /* The emulator's own screen keeps running but stays out of sight; the
       3D view and the overlay (#ui) show the game instead. */
    #game { position: fixed; left: -10000px; top: 0; width: 160px; height: 144px; }
    #view, #ui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { pointer-events: none; image-rendering: pixelated; }
    #controller { z-index: 5; }
    #romPicker {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: #111; color: #eee; font: 16px/1.4 system-ui, sans-serif; text-align: center; padding: 16px;
    }
    #romPicker[hidden] { display: none; }
    #romPicker code { background: #333; padding: 2px 6px; border-radius: 4px; }
    #back { position: fixed; top: 10px; left: 10px; z-index: 6; color: #fff; font: 13px system-ui, sans-serif;
      background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <div id="game"><canvas id="mainCanvas" width="160" height="144"></canvas></div>
  <canvas id="view"></canvas>
  <canvas id="ui"></canvas>
  <a id="back" href="../">2D version</a>
  <div id="romPicker" hidden>
    <p>Pick the <code>pokered.gbc</code> you built with <code>./build.sh</code>.<br>
       It stays on this device, so you only do this once.</p>
    <input type="file" accept=".gb,.gbc">
  </div>
  <div id="controller">
    <div id="controller_dpad">
      <div id="controller_left"></div>
      <div id="controller_right"></div>
      <div id="controller_up"></div>
      <div id="controller_down"></div>
    </div>
    <div id="controller_select" class="capsuleBtn">Select</div>
    <div id="controller_start" class="capsuleBtn">Start</div>
    <div id="controller_b" class="roundBtn">B</div>
    <div id="controller_a" class="roundBtn">A</div>
  </div>
  <script>window.ROM_URL = '../pokered.gbc';</script>
  <script src="../binjgb.js"></script>
  <script src="../player.js"></script>
  <script type="module" src="hd.js"></script>
</body>
</html>
