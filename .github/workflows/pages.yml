# Publishes the player in web/ to the gh-pages branch, which GitHub Pages
# serves. The ROM is never part of the site: players pick the pokered.gbc they
# built, and the page remembers it.
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web/ (without any ROM) to gh-pages
        run: |
          rm -f web/*.gb web/*.gbc
          touch web/.nojekyll
          cd web
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish the player from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" gh-pages
