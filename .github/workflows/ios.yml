# Builds the native game (native/, Godot) into an unsigned iPhone app (.ipa)
# on a Mac runner and publishes it as the release "ios-latest". SideStore on
# the phone signs it with a free Apple ID and installs it.
name: iOS app

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/ios.yml', 'tools/native/pack_ids.sh', 'tools/native/tv_plugin/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT: 4.7.2

defaults:
  run:
    shell: bash   # -eo pipefail: a failing step stops the build

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Godot 4.7's iOS engine links against the iOS 26 SDK (Metal tensors,
      # HDR display ranges): build with the newest Xcode on the runner
      - name: Newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $X"; ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Godot and the iOS export template (cached)
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT }}-ios

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_macos.universal.zip"
          unzip -q g.zip && rm g.zip
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}-stable/Godot_v${GODOT}-stable_export_templates.tpz"
          unzip -q t.tpz 'templates/ios.zip' 'templates/version.txt' && rm t.tpz
          D="$HOME/Library/Application Support/Godot/export_templates/${GODOT}.stable"
          mkdir -p "$D" && mv templates/* "$D/"

      # the TV output (tools/native/tv_plugin: AirPlay / HDMI second screen) as a
      # GDExtension: godot-cpp built for the phone (cached) and the plugin with it,
      # into native/tv/ios (git-ignored, so the app's patch ids do not change)
      - name: godot-cpp for the TV plugin (cached)
        uses: actions/cache@v4
        with:
          path: ~/godot-cpp
          key: godot-cpp-4.5-ios-${{ hashFiles('tools/native/tv_plugin/build_profile.json', 'tools/native/tv_plugin/SConstruct') }}

      - name: Build the TV plugin
        run: |
          command -v scons >/dev/null || pipx install scons || python3 -m pip install --break-system-packages scons
          tools/native/tv_plugin/build_ios.sh native/tv/ios

      - name: Export the Xcode project
        working-directory: native
        run: |
          G=~/godot/Godot.app/Contents/MacOS/Godot
          # the app's own patch ids (boot.gd / updater.gd compare them with the
          # patch server's manifest); before --import, which may add files
          ../tools/native/pack_ids.sh "$($G --version | tail -1 | cut -d. -f1-4)" > patch_base.json
          cat patch_base.json
          $G --headless --path . --import || true
          mkdir -p build/ios
          # project only: signing happens on the phone (SideStore)
          $G --headless --path . --export-release "iOS" build/ios/PalletTown.ipa 2>&1 | tee export.log
          test -d build/ios/PalletTown.xcodeproj
          # the TV plugin is in the project and its entry point is registered
          grep -q "libpallet_tv.a" build/ios/PalletTown.xcodeproj/project.pbxproj
          grep -rq "pallet_tv_init" build/ios/PalletTown/ || { echo "the TV plugin's entry point was not registered"; exit 1; }
          # the app's own pack as the phone sees it: the world found and loaded
          # through the game's loaders, no desktop-only texture formats
          PCK=$(find build/ios -name '*.pck' -not -path '*/dd/*' | head -1)
          echo "pack: $PCK"; test -n "$PCK"
          $G --headless --main-pack "$PCK" --script "$PWD/../tools/native/check_pack.gd" 2>&1 | grep '^check_pack'

      - name: Build the app (unsigned)
        working-directory: native/build/ios
        run: |
          xcodebuild -project PalletTown.xcodeproj -scheme PalletTown -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tail -40
          APP=$(find dd/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "app: $APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          # an ad hoc signature carrying the app's entitlements (the unsigned build
          # has none): SideStore re-signs with the entitlements it finds in the app
          A="Payload/$(basename "$APP")"
          ENT=$(find PalletTown -maxdepth 2 -name '*.entitlements' | head -1)
          echo "entitlements file: $ENT"; cat "$ENT"
          find "$A" -name '*.framework' -o -name '*.dylib' | while read -r f; do codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements "$ENT" --timestamp=none "$A"
          zip -qr PalletTown.ipa Payload
          ls -la PalletTown.ipa

      - name: Check the built app (Info.plist keys, entitlements)
        working-directory: native/build/ios
        run: |
          rm -rf check && mkdir check && cd check && unzip -q ../PalletTown.ipa
          A=$(ls -d Payload/*.app); P="$A/Info.plist"
          for k in LSApplicationCategoryType GCSupportsGameMode GCSupportsControllerUserInteraction CADisableMinimumFrameDurationOnPhone; do
            printf '%s = ' "$k"; plutil -extract "$k" raw -o - "$P" || { echo "missing $k"; exit 1; }
          done
          plutil -extract GCSupportedGameControllers json -o - "$P"; echo
          plutil -extract UIApplicationSceneManifest json -o - "$P"; echo
          echo "entitlements:"; codesign -d --entitlements - --xml "$A" 2>/dev/null | plutil -convert xml1 -o - - || codesign -d --entitlements - "$A"
          codesign -d --entitlements - --xml "$A" 2>/dev/null | grep -q increased-memory-limit || { echo "the memory entitlement is not in the app"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PalletTown-ipa
          path: native/build/ios/PalletTown.ipa

      - name: Publish to the release "ios-latest" (a fixed link for the phone)
        # (a run on another branch, from the Actions tab, only builds: its .ipa is the artifact)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-latest >/dev/null 2>&1 || gh release create ios-latest --title "iOS app (latest)" --notes "Unsigned build of native/. Install with SideStore." --prerelease
          gh release upload ios-latest native/build/ios/PalletTown.ipa --clobber
          gh release edit ios-latest --notes "Unsigned build of native/ from ${GITHUB_SHA::7}. Install with SideStore."
