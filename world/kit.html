<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Asset library preview</title>
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }</script>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}#i{position:fixed;left:8px;top:8px;font:12px monospace;color:#fff;text-shadow:0 1px 2px #000}</style></head>
<body><div id="i"></div><script type="module">
// The building, prop and crop library on a lawn, in the game's light and ink.
//   ?show=<scene>  (see SCENES)  ?cam=px,py,pz,tx,ty,tz  ?ink=0
// window.shoot(scene, cam) re-renders another scene (for the review sheets).
import * as THREE from 'three';
import { buildSky } from './nature.js';
import { createOutline } from './outline.js';
import { foliageTime } from './foliage.js';
import * as CR from './crops.js';
import * as O from './props/outdoor.js';
import * as B from './props/buildings.js';
import * as FA from './props/farm.js';
import * as BO from './props/boats.js';
import { buildProp } from './props/index.js';
import { CATALOG } from './props/catalog.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const sunDir = new THREE.Vector3(-0.55, 0.75, 0.45).normalize();
scene.add(buildSky(sunDir)); scene.fog = new THREE.Fog('#cfe2e8', 120, 500);
scene.add(new THREE.HemisphereLight('#dff0ff', '#6d7f4c', 1.2));
const sun = new THREE.DirectionalLight('#fff0d4', 2.9); sun.position.copy(sunDir).multiplyScalar(60); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, far: 150 }); sun.shadow.bias = -0.0005; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#79c84a' }));
ground.receiveShadow = true; scene.add(ground); ground.userData.outline = 'ground';
const ink = createOutline(r, { scale: 1 }); if (q.get('ink') === '0') ink.enabled = false;
const flat0 = () => 0;
const G = new THREE.Group(); scene.add(G);
const put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; G.add(o); return o; };
const SCENES = {
  crops: () => {
    const kinds = CR.CROPS;
    kinds.forEach((k, i) => { for (let s = 0; s < 3; s++) { const pts = [[(i % 6) * 2.2 - 5.5 + s * 0.6 - 0.6, 0, Math.floor(i / 6) * 3 - 1.5 + s * 0.0, s * 1.3, 1]]; CR.plantAt(G, k, pts, { stage: s + (k === 'corn' || k === 'wheat' ? (s === 2 ? 1 : 0) : 0), seeds: 1 }); } });
    return '0,3.2,8,0,0.6,0';
  },
  field: () => {
    const spec = { cx: 0, cz: 0, w: 8, d: 10, rows: 8, heightAt: flat0 };
    const bed = new THREE.Mesh(CR.bedGeometry(spec), CR.plantSolid(0)); bed.receiveShadow = true; bed.userData.outline = false; G.add(bed);
    const rows = CR.bedRows({ ...spec, spacing: 0.6 });
    const kinds = ['cabbage', 'cabbage', 'lettuce', 'carrot', 'corn', 'corn', 'tomato', 'pumpkin'];
    rows.forEach((row, i) => CR.plantAt(G, kinds[i], kinds[i] === 'pumpkin' ? row.filter((_, j) => j % 3 === 0) : kinds[i] === 'tomato' ? row.filter((_, j) => j % 2 === 0) : row, { stage: kinds[i] === 'corn' ? 2 : 2 }));
    return '4,4.5,10,0,0.4,0';
  },
};
for (const k of CR.CROPS) SCENES['crop_' + k] = () => { for (let s = 0; s < 4; s++) CR.plantAt(G, k, [[s * 1.1 - 1.65, 0, 0, 0.6, 1]], { stage: s, seeds: 1 }); return '0,1.3,3.2,0,0.5,0'; };
SCENES.bench_berries = () => {
  put(O.shogiBench(), -1.2, 0, 0.3);
  const BP = CR.berryParts({ r: 0.13 });
  ['#3a6ad8', '#f26aa0', '#e8402e', '#f2a23a'].forEach((c, i) => {
    put(new THREE.Mesh(BP.fruit, new THREE.MeshLambertMaterial({ color: c })), 1.0 + i * 0.4, 0, 0.3 * i, 1.0);
    put(new THREE.Mesh(BP.cap, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })), 1.0 + i * 0.4, 0, 0.3 * i, 1.0);
  });
  return '0.4,1.4,2.6,0.3,0.6,0';
};
SCENES.catalog_lab = () => {
  const types = Object.keys(CATALOG).filter((t) => !['kit_cottage', 'kit_shed', 'gazebo', 'crop_bed', 'crop_plant', 'scarecrow', 'hay_bale', 'square_bale', 'wheelbarrow', 'watering_can', 'tool_rack', 'water_trough', 'produce_crates', 'grain_sack', 'garden_trellis'].includes(t));
  let x = 0, z = 0, row = 0;
  for (const t of types) { const c = CATALOG[t], w = Math.max(1, c.size[0]); if (x + w > 14) { x = 0; z -= 3.6; } const o = buildProp({ id: t, type: t }); const y = c.mount === 'ceiling' ? 3.2 : c.mount === 'wall' ? c.size[2] / 2 + 0.6 : 0; put(o, x - 7 + w / 2, z, 0, y); x += w + 0.5; }
  return '0,9,9,0,0.8,-4';
};
// every outdoor catalog type through the editor's own path (buildProp)
SCENES.catalog_outdoor = () => {
  const types = ['kit_cottage', 'kit_shed', 'gazebo', 'crop_bed', 'crop_plant', 'scarecrow', 'hay_bale', 'square_bale', 'wheelbarrow', 'watering_can', 'tool_rack', 'water_trough', 'produce_crates', 'grain_sack', 'garden_trellis'];
  let x = -14;
  for (const t of types) { const w = CATALOG[t].size[0]; put(buildProp({ id: t, type: t }), x + w / 2, 0, 0.2); x += w + 0.8; }
  return '0,14,30,0,1,0';
};
for (const [k, f] of Object.entries(B.PREVIEW || {})) SCENES[k] = f.bind(null, G, put);
for (const [k, f] of Object.entries(BO.PREVIEW || {})) SCENES[k] = f.bind(null, G, put);
for (const [k, f] of Object.entries(FA.PREVIEW || {})) SCENES[k] = f.bind(null, G, put);
for (const [k, f] of Object.entries(O.PREVIEW || {})) SCENES[k] = f.bind(null, G, put);
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
const setCam = (s) => { const v = s.split(',').map(Number); cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]); };
function show(name, camS) {
  G.clear();
  const def = SCENES[name]();
  setCam(camS || def);
  let meshes = 0, tris = 0; G.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
  foliageTime.value = 1.0;
  r.render(scene, cam); ink.render(scene, cam);
  document.getElementById('i').textContent = `${name} · meshes ${meshes} · tris ${Math.round(tris)}`;
  return { meshes, tris: Math.round(tris) };
}
window.SCENES = Object.keys(SCENES);
window.shoot = (name, camS) => show(name, camS);
window.stats = show(q.get('show') || 'crops', q.get('cam'));
window.ready = true;
</script></body></html>
