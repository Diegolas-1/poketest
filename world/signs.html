<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Signs preview</title>
<script type="importmap">{ "imports": { "three": "../lib/three/three.module.min.js", "three/addons/": "../lib/three/addons/" } }</script>
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}#i{position:fixed;left:8px;top:8px;font:12px monospace;color:#fff;text-shadow:0 1px 2px #000}</style></head>
<body><div id="i"></div><script type="module">
// Every sign type from signs.js on a lawn, with a 1.6 m capsule for scale.
// ?view=all|welcome|route|plates|finger|lab|boards  ?cam=x,y,z,tx,ty,tz  ?ink=0
import * as THREE from 'three';
import { buildSky } from './nature.js';
import { createOutline, addEdgeLines } from './outline.js';
import { welcomeSign, routeSign, nameplate, fingerpost, labPlate, noticeBoard } from './signs.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(1); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const sunDir = new THREE.Vector3(-0.55, 0.75, 0.45).normalize();
scene.add(buildSky(sunDir)); scene.fog = new THREE.Fog('#cfe2e8', 80, 400);
scene.add(new THREE.HemisphereLight('#dff0ff', '#6d7f4c', 1.2));
const sun = new THREE.DirectionalLight('#fff0d4', 2.9); sun.position.copy(sunDir).multiplyScalar(60); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, far: 150 }); sun.shadow.bias = -0.0005; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: '#79c84a' }));
ground.receiveShadow = true; scene.add(ground); ground.userData.outline = 'ground';
const ink = createOutline(r, { scale: 1 }); if (q.get('ink') === '0') ink.enabled = false;
const G = new THREE.Group(); scene.add(G);
const put = (o, x, z, ry = 0, y = 0) => { o.position.set(x, y, z); o.rotation.y = ry; G.add(o); return o; };
put(welcomeSign(), -4.5, 0);
put(routeSign({ num: '1' }), 0, 0);
put(fingerpost([['Route 1', Math.PI / 2 + 0.2], ['Town square', 0.4], ['Oak lab', -0.5]]), 3.0, 0.4);
put(labPlate('OAK POKéMON RESEARCH LAB', { mount: 'posts', w: 1.7, h: 0.56, line2: 'Up the stairs →', height: 0.9 }), 6.2, 0);
put(noticeBoard('TRAINER TIPS', ['Wild POKéMON hide in tall grass.', 'Heal up before a long route.', 'Talk to everyone you meet!'], { style: 'chalk' }), 9.2, 0);
put(noticeBoard('PALLET BEACH', ['Mind the tide pools.', 'Take your litter home.', 'No swimming past the buoys.'], { style: 'pinned', frame: '#5f8fb0', roof: '#3d6fa8' }), 11.8, 0);
// a wall with the lab plate and a row of house nameplates on a fence rail
const wall = new THREE.Mesh(new THREE.BoxGeometry(8.6, 1.6, 0.2), new THREE.MeshLambertMaterial({ color: '#e8e2d2' })); wall.position.set(-1.2, 0.8, -3.2); wall.castShadow = wall.receiveShadow = true; G.add(wall);
put(labPlate('OAK POKéMON RESEARCH LAB', { mount: 'wall', w: 3.0, h: 0.5 }), -4.9 + 2.1, -3.1, 0, 1.15);
const names = ['RED', 'BLUE', 'HOLLIS', 'GRANNY MAE', 'MARINA', 'FARMER BEN', 'OLD TOM', 'LILY', 'BOATHOUSE'];
names.forEach((n, i) => put(nameplate(n), -4.6 + (i % 5) * 0.72 + (i >= 5 ? 0.36 : 0) + 3.0, -3.1, 0, i < 5 ? 0.55 : 0.25));
const cap = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 1.1, 4, 10), new THREE.MeshLambertMaterial({ color: '#e05050' }));
cap.position.set(-1.7, 0.8, 1.2); cap.castShadow = true; scene.add(cap);
const edges = q.get('ink') === '0' ? 0 : addEdgeLines(G);
const VIEWS = { all: '3.5,4.5,13,3.5,1.1,-1', welcome: '-4.5,1.4,4.2,-4.5,1.25,0', route: '0.1,1.6,3.2,0,1.75,0', finger: '4.6,1.8,3.0,3.0,1.8,0', lab: '6.2,1.3,2.6,6.2,1.15,0',
  boards: '10.5,1.5,3.8,10.5,1.3,0', plates: '0.7,0.6,-0.6,0.7,0.45,-3.1', wall: '-2.8,1.4,0.2,-2.8,1.15,-3.1', graze: '-6.9,1.25,1.0,-4.5,1.25,0' };
const cam = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.25, 2000);
const c = (q.get('cam') || VIEWS[q.get('view') || 'all']).split(',').map(Number);
cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]);
let meshes = 0; G.traverse((o) => { if (o.isMesh) meshes++; });
document.getElementById('i').textContent = `meshes ${meshes} · edges ${edges}`;
window.setCam = (s) => { const v = s.split(',').map(Number); cam.position.set(v[0], v[1], v[2]); cam.lookAt(v[3], v[4], v[5]); r.render(scene, cam); ink.render(scene, cam); };
r.render(scene, cam); ink.render(scene, cam);
window.stats = { meshes, edges };
setTimeout(() => { window.ready = true; }, 300);
</script></body></html>
