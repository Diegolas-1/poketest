<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Map blueprint</title>
<script type="importmap">{ "imports": { "three": "../../lib/three/three.module.min.js", "three/addons/": "../../lib/three/addons/" } }</script>
<style>html,body{margin:0;background:#f4efe2}canvas{display:block}</style></head>
<body><script type="module">
// Drawings of a map blueprint (maps/format.js): ?map=oak_lab&mode=plan (the
// labelled floor plans with camera notes) or mode=axo (the block model seen
// from above at an angle, cut open at ?cut= metres).
import * as THREE from 'three';
import { drawPlan, planSize } from './plan.js';
import { blockModel } from './blocks.js';
import { validate, wallSegments, propBox, propMount } from './format.js';
import { CATALOG } from '../props/catalog.js';
const q = new URLSearchParams(location.search);
const bp = await (await fetch(`${q.get('map') || 'oak_lab'}.json`)).json();
const f1 = new FontFace('Fredoka', 'url(../fonts/Fredoka-Variable.ttf)', { weight: '300 700' });
const f2 = new FontFace('Lilita One', 'url(../fonts/LilitaOne-Regular.ttf)');
await Promise.all([f1.load(), f2.load()]).then((l) => l.forEach((f) => document.fonts.add(f))).catch(() => {});
const V = validate(bp, CATALOG);
const mode = q.get('mode') || 'plan';
if (mode === 'plan') {
  const S = 46, pad = 70, [pw, ph] = planSize(bp, S, 0);
  const W = pw * 2 + pad * 3 + 0, H = ph + pad * 2 + 330;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.appendChild(cv);
  const x = cv.getContext('2d');
  x.fillStyle = '#f4efe2'; x.fillRect(0, 0, W, H);
  // blueprint grid paper
  x.strokeStyle = 'rgba(60,90,130,.08)'; x.lineWidth = 1; for (let i = 0; i < W; i += S / 2) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); } for (let i = 0; i < H; i += S / 2) { x.beginPath(); x.moveTo(0, i); x.lineTo(W, i); x.stroke(); }
  const title = (t, X, Y, px = 30, c = '#23284f') => { x.font = `400 ${px}px "Lilita One"`; x.fillStyle = c; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillText(t, X, Y); };
  const txt = (t, X, Y, px = 15, c = '#2c3446', w = 600, al = 'left') => { x.font = `${w} ${px}px "Fredoka"`; x.fillStyle = c; x.textAlign = al; x.textBaseline = 'middle'; x.fillText(t, X, Y); };
  title(`${bp.name.toUpperCase()} · BLUEPRINT`, pad, 46, 34);
  txt(`format ${bp.format} v${bp.version} · ${bp.kind} · grid ${bp.grid} m · 1 square = 0.5 m · north up · validator: ${V.errors.length} errors, ${V.warnings.length} warnings`, pad, 74, 15, '#5a6070');
  const [bx0, bz0] = bp.bounds;
  const lv = [['ground', 'GROUND FLOOR  y 0.0'], ['mezz', 'MEZZANINE  y 3.4']];
  lv.forEach(([id, name], k) => {
    const X = pad + k * (pw + pad), Y = pad + 50;
    title(name, X, Y - 8, 22, '#3a4a7a');
    const { P } = drawPlan(x, bp, CATALOG, { x: X, y: Y, scale: S, level: id, camera: false });
    // prop labels
    for (const p of bp.props) {
      if (p.level !== id) continue;
      const c = CATALOG[p.type], b = propBox(p, CATALOG), m = propMount(p, CATALOG);
      if (['pendant_lamp', 'wall_vent', 'wall_clock', 'framed_picture', 'tablet', 'desk_computer', 'desk_lamp', 'panel_light', 'door_mat'].includes(p.type)) continue;
      const [px, py] = P(b[0], b[1]);
      const lab = c.plan[1];
      x.font = `600 12px "Fredoka"`; const tw = x.measureText(lab).width + 6;
      x.fillStyle = m === 'ceiling' ? 'rgba(255,240,250,.9)' : 'rgba(255,255,255,.82)'; x.fillRect(px - tw / 2, py - 8, tw, 16);
      txt(lab, px, py, 12, m === 'ceiling' ? '#7a3a8a' : '#23284f', 600, 'center');
    }
    // room names
    for (const z of bp.zones) if (z.level === id) {
      const cx = z.poly.reduce((a, p) => a + p[0], 0) / z.poly.length, cz = z.poly.reduce((a, p) => a + p[1], 0) / z.poly.length;
      const [px, py] = P(cx - (z.id === 'hall' ? 3.2 : 0), cz + (z.id === 'hall' ? 2.2 : -0.6));
      x.font = '400 26px "Lilita One"'; x.globalAlpha = 0.55; x.fillStyle = '#3a2a6a'; x.textAlign = 'center'; x.fillText(z.name.toUpperCase(), px, py); x.globalAlpha = 1;
      const c = z.ceiling;
      txt(c.type === 'vault' ? `barrel vault, spring ${c.spring} m, crown ${c.spring + c.rise} m, ribs every ${c.ribs} m` : `flat ceiling ${c.h} m`, px, py + 22, 13, '#5a4a7a', 500, 'center');
    }
    for (const s of bp.slabs || []) if (s.level === id) { const [px, py] = P(16, -0.8); x.font = '400 22px "Lilita One"'; x.fillStyle = 'rgba(30,70,60,.7)'; x.textAlign = 'center'; x.fillText('MEZZANINE DECK', px, py); txt('steel deck, rail along the hall side', px, py + 20, 13, '#2b5a4a', 500, 'center'); }
    if (id === 'ground') {
      const note = (t, xx, zz, c = '#23284f') => { const [px, py] = P(xx, zz); txt(t, px, py, 13, c, 600, 'left'); };
      note('FRONT DOOR → outside (portal to_town)', 0.3, -1.2, '#1f7a40');
      note('spawn', 1.0, 0.55, '#1f7a40');
      note('Oak', 4.95, -3.85, '#7a2a8a');
      note('stairs up to the mezzanine', 8.6, -4.25, '#1e2a40');
      note('under the mezzanine', 14.6, -2.2, '#2b5a4a'); note('(slab overhead, dashed)', 14.6, -1.8, '#2b5a4a');
      note('open arch to the wing', 3.6, 5.6, '#23284f');
      note('wide window with blinds; triple arch above', 15.2, 6.6, '#3a78b8');
      note('pendant lamp + chain hoist hang from the vault (dashed)', 6.2, 1.9, '#7a3a8a');
    } else {
      const note = (t, xx, zz, c = '#23284f') => { const [px, py] = P(xx, zz); txt(t, px, py, 13, c, 600, 'left'); };
      note('the hall below: open to the vault', 3.5, 0, '#5a4a7a');
      note('stairs arrive here', 9.0, -4.25, '#1e2a40');
      note('study door (locked)', 14.5, -6.6, '#a03030');
    }
    // scale bar and north arrow
    const [sx, sy] = P(bx0 + 0.6, bp.bounds[3] - 0.4);
    x.fillStyle = '#23284f'; for (let i = 0; i < 5; i++) { x.fillStyle = i % 2 ? '#ffffff' : '#23284f'; x.fillRect(sx + i * S, sy, S, 7); } x.strokeStyle = '#23284f'; x.strokeRect(sx, sy, S * 5, 7);
    txt('0', sx, sy + 16, 12); txt('5 m', sx + 5 * S, sy + 16, 12, '#23284f', 600, 'center');
    if (k === 0) { const [nx, ny] = P(bp.bounds[2] - 0.6, bz0 + 0.7); x.fillStyle = '#23284f'; x.beginPath(); x.moveTo(nx, ny - 18); x.lineTo(nx + 9, ny + 8); x.lineTo(nx, ny + 2); x.lineTo(nx - 9, ny + 8); x.fill(); txt('N', nx, ny + 20, 14, '#23284f', 700, 'center'); }
    // camera volumes for this level
    for (const v of bp.camera.volumes) {
      const onL = id === 'ground' ? v.box[1] < 3 : v.box[4] > 3.4 && v.id !== 'wing' && v.id !== 'wing_arch' && v.id !== 'under_mezz';
      if (!onL) continue;
      const [a, , b, c2, , d] = v.box; const [p0x, p0y] = P(a, b), [p1x, p1y] = P(c2, d);
      x.strokeStyle = 'rgba(214,60,140,.85)'; x.lineWidth = 2; x.setLineDash([6, 5]); x.strokeRect(p0x + 3, p0y + 3, p1x - p0x - 6, p1y - p0y - 6); x.setLineDash([]);
      txt(`cam ${v.id}: ${v.dist} m, pitch ${v.pitch}${v.vault ? ', vaulted top' : `, top ${v.box[4]} m`}`, p0x + 8, p0y + 14, 12, '#b0306e', 700);
    }
  });
  // legend and notes at the bottom
  const LY0 = pad + 70 + ph + 20;
  title('KEY', pad, LY0, 22, '#3a4a7a');
  const items = [['#232838', 'wall (0.3 m)'], ['#3a78b8', 'window (dashed = high)'], ['#8a5634', 'door + swing'], ['#a03030', 'locked door'], ['rgba(60,200,110,.7)', 'portal (walk in to leave)'], ['#1f8a4a', 'spawn (arrow = facing)'], ['#7a2a8a', 'actor'], ['#2b5a4a', 'railing / mezzanine edge'], ['rgba(214,60,140,.85)', 'camera volume']];
  items.forEach(([c, t], i) => { const X = pad + (i % 5) * 300, Y = LY0 + 26 + Math.floor(i / 5) * 26; x.fillStyle = c; x.fillRect(X, Y - 7, 22, 14); txt(t, X + 30, Y, 14); });
  title('CAMERA NOTES', pad, LY0 + 110, 22, '#3a4a7a');
  const notes = [
    'The camera never leaves the union of the camera volumes (a sphere of 0.28 m kept inside): walls, the vault, the wing ceiling and the mezzanine slab stop it, so it never shows the outside of the set.',
    'Each volume sets the framing for the player standing in it (first match wins): closer and lower than outdoors (5.2-5.6 m in the hall, 4.2 m in the wing, 3.8 m under the slab).',
    'Under the mezzanine the slab is 3.15 m up: the camera drops to a low, close angle; on the deck it climbs to a steeper look over the rail into the hall.',
    `Compiled: ${V.space ? V.space.grid.nx + 'x' + V.space.grid.nz : '?'} cells of 0.25 m per level, ${V.space ? V.space.colliders.length : '?'} colliders, ${V.space ? V.space.uses.length : '?'} things to look at, ${bp.props.length} props of ${new Set(bp.props.map((p) => p.type)).size} types.`,
  ];
  notes.forEach((t, i) => txt('• ' + t, pad, LY0 + 136 + i * 24, 14, '#2c3446', 500));
  void wallSegments;
} else {
  const W = 1800, H = 1200;
  const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setPixelRatio(1); document.body.appendChild(r.domElement);
  r.shadowMap.enabled = true;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#f4efe2');
  scene.add(new THREE.HemisphereLight('#ffffff', '#b8b0c8', 1.6));
  const sun = new THREE.DirectionalLight('#ffffff', 2.2); sun.position.set(-20, 40, -14); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 120 }); sun.target.position.set(9, 0, 4); scene.add(sun, sun.target);
  const cut = Number(q.get('cut') || 6.4);
  const G = blockModel(bp, CATALOG, { cut, roof: q.has('roof') });
  scene.add(G);
  // a grid under it
  const grid = new THREE.GridHelper(40, 40, '#c9bfa8', '#ddd4c0'); grid.position.set(9, -0.13, 3.5); scene.add(grid);
  const cam = new THREE.OrthographicCamera(-17, 17, 11.3, -11.3, 0.1, 200);
  const az = Number(q.get('az') || -38) * Math.PI / 180, el = Number(q.get('el') || 52) * Math.PI / 180;
  const T = new THREE.Vector3(10.6, 1.2, 2.6);
  cam.position.set(T.x + Math.sin(az) * Math.cos(el) * 60, T.y + Math.sin(el) * 60, T.z + Math.cos(az) * Math.cos(el) * 60);
  cam.lookAt(T);
  r.render(scene, cam);
}
window.ready = true;
</script></body></html>
